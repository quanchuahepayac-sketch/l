<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Đọc Truyện</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.5/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
    <style>
        /* Dùng 100dvh để đo chuẩn chiều cao thực tế của điện thoại */
        html, body { 
            margin: 0; padding: 0; font-family: sans-serif; 
            background: #121212; color: #e0e0e0; 
            overflow: hidden; transition: background 0.3s; 
            width: 100vw; height: 100%; height: 100dvh; 
        }
        
        /* CHÉM HẲN 80PX DƯỚI CÙNG ĐỂ NHƯỜNG CHỖ CHO NÚT */
        #viewer { 
            width: 100%; 
            height: calc(100% - 80px); 
        }
        
        /* Nút Mục lục & Setting trên cùng */
        #toc-btn {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.5); color: white; padding: 8px 15px; border-radius: 6px; 
            font-size: 14px; z-index: 100; cursor: pointer; border: 1px solid #444;
            max-width: 50vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        #settings-btn {
            position: absolute; top: 10px; right: 10px; z-index: 100;
            background: rgba(0,0,0,0.5); border: 1px solid #444; color: white;
            border-radius: 50%; width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; cursor: pointer;
        }

        /* Nút Chuyển chương ở 2 góc dưới (Mờ) */
        .nav-btn {
            position: fixed; bottom: 15px; z-index: 100;
            background: rgba(0, 0, 0, 0.3); color: white; border: 1px solid #555;
            width: 50px; height: 50px; border-radius: 50%; display: flex;
            align-items: center; justify-content: center; cursor: pointer; font-size: 20px;
        }
        #prev-chap { left: 15px; }
        #next-chap { right: 15px; }
        .nav-btn:active { background: rgba(0, 0, 0, 0.8); }

        /* Bảng Setting */
        #settings-panel {
            display: none; position: absolute; top: 55px; right: 10px; z-index: 110;
            background: #222; padding: 15px; border-radius: 8px; border: 1px solid #444; width: 220px;
        }
        .setting-row { margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .setting-row button { background: #444; color: white; border: none; padding: 5px 10px; border-radius: 4px; }
        
        /* Cục chọn màu */
        .color-btn { width: 28px; height: 28px; border-radius: 50%; border: 1px solid #666; cursor: pointer; }

        /* Modal Mục lục */
        #toc-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 200; }
        #toc-modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 85%; height: 80%; background: #1a1a1a; border-radius: 10px;
            display: flex; flex-direction: column; overflow: hidden; border: 1px solid #444;
        }
        #toc-header { padding: 15px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; background: #222; }
        #close-toc { background: none; border: none; color: #ff5f56; font-size: 24px; cursor: pointer; }
        #toc-list { list-style: none; padding: 0; margin: 0; overflow-y: auto; flex-grow: 1; color: #eee;}
        #toc-list li { padding: 15px; border-bottom: 1px solid #222; cursor: pointer; }
    </style>
</head>
<body>

    <div id="toc-btn">Đang tải... ▼</div>
    <div id="settings-btn">⚙️</div>
    
    <div id="settings-panel">
        <div class="setting-row">
            <span>Cỡ chữ</span>
            <div>
                <button id="font-decrease">-</button>
                <button id="font-increase">+</button>
            </div>
        </div>
        <div class="setting-row">
            <span>Màu nền</span>
            <div style="display: flex; gap: 8px;">
                <div class="color-btn" id="bg-light" style="background:#fff"></div>
                <div class="color-btn" id="bg-sepia" style="background:#f4ecd8" title="Vàng nhạt"></div>
                <div class="color-btn" id="bg-old" style="background:#d2b48c" title="Vàng cổ"></div>
                <div class="color-btn" id="bg-dark" style="background:#121212"></div>
            </div>
        </div>
    </div>

    <div id="toc-overlay">
        <div id="toc-modal">
            <div id="toc-header">
                <h3>Mục lục</h3>
                <button id="close-toc">✖</button>
            </div>
            <ul id="toc-list"></ul>
        </div>
    </div>

    <div id="viewer"></div>

    <div class="nav-btn" id="prev-chap">❮</div>
    <div class="nav-btn" id="next-chap">❯</div>

    <script>
        let currentFontSize = 100;
        let book = ePub("quybichichu.epub"); 
        
        let rendition = book.renderTo("viewer", {
            width: "100%", height: "100%", flow: "scrolled-doc", manager: "default"
        });

        // Bỏ padding 80px ở đây vì đã cắt thẳng bằng CSS của viewer rồi
        rendition.themes.register("light", { "body": { "background": "#ffffff", "color": "#000", "padding": "20px 15px" }});
        rendition.themes.register("sepia", { "body": { "background": "#f4ecd8", "color": "#5b4636", "padding": "20px 15px" }});
        rendition.themes.register("old", { "body": { "background": "#d2b48c", "color": "#1a1a1a", "padding": "20px 15px" }});
        rendition.themes.register("dark", { "body": { "background": "#121212", "color": "#e0e0e0", "padding": "20px 15px" }});
        
        rendition.themes.default({ "p": { "font-size": currentFontSize + "%", "line-height": "1.6" } });
        applyTheme('dark');
        rendition.display();

        book.loaded.navigation.then(function(toc){
            let list = document.getElementById("toc-list");
            toc.forEach(function(chapter) {
                let li = document.createElement("li");
                li.textContent = chapter.label;
                li.onclick = () => { rendition.display(chapter.href); document.getElementById('toc-overlay').style.display = 'none'; };
                list.appendChild(li);
            });
        });

        rendition.on('relocated', function(location) {
            let navItem = book.navigation.get(location.start.href);
            document.getElementById('toc-btn').innerHTML = (navItem ? navItem.label : 'Mục lục').substring(0, 20) + '... ▼';
        });

        document.getElementById('next-chap').onclick = () => rendition.next();
        document.getElementById('prev-chap').onclick = () => rendition.prev();
        document.getElementById('toc-btn').onclick = () => document.getElementById('toc-overlay').style.display = 'block';
        document.getElementById('close-toc').onclick = () => document.getElementById('toc-overlay').style.display = 'none';
        document.getElementById('toc-overlay').onclick = function(e) { if (e.target == this) this.style.display = 'none'; };

        function applyTheme(themeName) {
            rendition.themes.select(themeName);
            let bg = "#121212";
            if(themeName === 'light') bg = "#ffffff";
            if(themeName === 'sepia') bg = "#f4ecd8";
            if(themeName === 'old') bg = "#d2b48c";
            // Set màu nền tổng bên ngoài để đồng bộ màu dưới khu vực nút
            document.body.style.backgroundColor = bg;
        }

        document.getElementById('bg-light').onclick = () => applyTheme('light');
        document.getElementById('bg-sepia').onclick = () => applyTheme('sepia');
        document.getElementById('bg-old').onclick = () => applyTheme('old');
        document.getElementById('bg-dark').onclick = () => applyTheme('dark');
        
        document.getElementById('settings-btn').onclick = () => {
            let panel = document.getElementById('settings-panel');
            panel.style.display = (panel.style.display === 'block') ? 'none' : 'block';
        };

        document.getElementById('font-increase').onclick = () => { currentFontSize += 10; rendition.themes.fontSize(currentFontSize + "%"); };
        document.getElementById('font-decrease').onclick = () => { currentFontSize -= 10; rendition.themes.fontSize(currentFontSize + "%"); };

    </script>
</body>
</html>
