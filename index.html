<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Quỷ Bí Chi Chủ</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.5/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
    <style>
        body { margin: 0; font-family: sans-serif; overflow: hidden; transition: background 0.3s; }
        #viewer { width: 100vw; height: 100vh; }
        
        #toc-btn {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7); color: white;
            padding: 8px 15px; border-radius: 6px; font-size: 14px;
            z-index: 100; cursor: pointer; border: 1px solid #555;
            display: flex; align-items: center; justify-content: center;
            max-width: 60vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        #settings-btn {
            position: absolute; top: 10px; right: 15px; z-index: 100; display: flex;
            background: rgba(0,0,0,0.7); border: 1px solid #555; color: white;
            border-radius: 50%; width: 35px; height: 35px; font-size: 18px;
            align-items: center; justify-content: center; cursor: pointer;
        }

        #settings-panel {
            display: none; position: absolute; top: 55px; right: 15px; z-index: 100;
            background: #222; color: white; padding: 15px; border-radius: 8px; border: 1px solid #444; width: 220px;
        }
        .setting-row { margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;}
        .setting-row button { background: #444; color: white; border: none; padding: 5px 12px; border-radius: 4px; cursor: pointer;}
        
        .color-options { display: flex; gap: 10px; }
        .color-btn { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #666; cursor: pointer; }
        #bg-light { background: #ffffff; }
        #bg-dark { background: #121212; }
        #bg-sepia { background: #f4ecd8; }

        #toc-modal {
            display: none; position: absolute; top: 10%; left: 10%; width: 80%; height: 80%;
            background: #1a1a1a; color: white; z-index: 200; border-radius: 8px; border: 1px solid #555;
            overflow-y: auto; box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        #toc-modal h3 { text-align: center; margin-top: 15px; border-bottom: 1px solid #333; padding-bottom: 10px;}
        #toc-list { list-style: none; padding: 0; margin: 0; }
        #toc-list li { padding: 15px; border-bottom: 1px solid #333; cursor: pointer; }
        #toc-list li:active { background: #333; }
        #close-toc { position: absolute; top: 10px; right: 15px; background: none; border: none; color: white; font-size: 20px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="toc-btn">Mục lục ▼</div>
    <div id="settings-btn">⚙️</div>
    
    <div id="settings-panel">
        <div class="setting-row">
            <span>Cỡ chữ</span>
            <div>
                <button id="font-decrease">-</button>
                <button id="font-increase">+</button>
            </div>
        </div>
        <div class="setting-row">
            <span>Màu nền</span>
            <div class="color-options">
                <div class="color-btn" id="bg-light"></div>
                <div class="color-btn" id="bg-sepia"></div>
                <div class="color-btn" id="bg-dark"></div>
            </div>
        </div>
        <div class="setting-row">
            <span>Căn lề</span>
            <div>
                <button id="align-left">Trái</button>
                <button id="align-justify">Đều</button>
            </div>
        </div>
    </div>

    <div id="toc-modal">
        <button id="close-toc">✖</button>
        <h3>Danh sách Chương</h3>
        <ul id="toc-list"></ul>
    </div>

    <div id="viewer"></div>

    <script>
        let currentFontSize = 100;
        
        // Gọi thẳng file truyện
        let book = ePub("books/quybichichu.epub"); 
        
        let rendition = book.renderTo("viewer", {
            width: "100%", height: "100%", flow: "paginated", manager: "default"
        });

        rendition.themes.register("light", { "body": { "background": "#ffffff", "color": "#000000" }});
        rendition.themes.register("sepia", { "body": { "background": "#f4ecd8", "color": "#5b4636" }});
        rendition.themes.register("dark", { "body": { "background": "#121212", "color": "#e0e0e0" }});

        rendition.themes.default({
            "p": { "font-size": currentFontSize + "%", "text-align": "left", "line-height": "1.5" }
        });

        applyTheme('dark');
        rendition.display();

        book.loaded.navigation.then(function(toc){
            let list = document.getElementById("toc-list");
            list.innerHTML = ''; 
            toc.forEach(function(chapter) {
                let li = document.createElement("li");
                li.textContent = chapter.label;
                li.onclick = () => {
                    rendition.display(chapter.href);
                    document.getElementById('toc-modal').style.display = 'none';
                };
                list.appendChild(li);
            });
        });

        rendition.on('relocated', function(location) {
            let navItem = book.navigation.get(location.start.href);
            let btnText = navItem ? navItem.label : 'Mục lục';
            if(btnText.length > 25) btnText = btnText.substring(0, 25) + '...';
            document.getElementById('toc-btn').innerHTML = btnText + ' ▼';
        });

        function applyTheme(themeName) {
            rendition.themes.select(themeName);
            if (themeName === 'light') document.body.style.backgroundColor = "#ffffff";
            if (themeName === 'sepia') document.body.style.backgroundColor = "#f4ecd8";
            if (themeName === 'dark') document.body.style.backgroundColor = "#121212";
        }

        document.getElementById('bg-light').onclick = () => applyTheme('light');
        document.getElementById('bg-sepia').onclick = () => applyTheme('sepia');
        document.getElementById('bg-dark').onclick = () => applyTheme('dark');

        document.getElementById('settings-btn').onclick = function() {
            let panel = document.getElementById('settings-panel');
            panel.style.display = (panel.style.display === 'block') ? 'none' : 'block';
        };

        document.getElementById('toc-btn').onclick = function() {
            document.getElementById('toc-modal').style.display = 'block';
            document.getElementById('settings-panel').style.display = 'none';
        };

        document.getElementById('font-increase').onclick = () => { currentFontSize += 10; rendition.themes.fontSize(currentFontSize + "%"); };
        document.getElementById('font-decrease').onclick = () => { currentFontSize -= 10; rendition.themes.fontSize(currentFontSize + "%"); };
        document.getElementById('align-left').onclick = () => { rendition.themes.default({"p": {"text-align": "left"}}); rendition.display(rendition.location.start.cfi); };
        document.getElementById('align-justify').onclick = () => { rendition.themes.default({"p": {"text-align": "justify"}}); rendition.display(rendition.location.start.cfi); };

        document.getElementById('close-toc').onclick = function() {
            document.getElementById('toc-modal').style.display = 'none';
        };

        let touchStartX = 0;
        let touchEndX = 0;

        rendition.on("touchstart", event => {
            touchStartX = event.changedTouches[0].screenX;
        });

        rendition.on("touchend", event => {
            touchEndX = event.changedTouches[0].screenX;
            
            if (touchStartX - touchEndX > 50) {
                rendition.next();
            } else if (touchEndX - touchStartX > 50) {
                rendition.prev();
            } else {
                document.getElementById('settings-panel').style.display = 'none';
            }
        });
    </script>
</body>
</html>
