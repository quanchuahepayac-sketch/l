<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kho Truyện Của Lộc</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.5/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
    <style>
        body { margin: 0; font-family: sans-serif; background: #121212; color: white; }
        #viewer { width: 100vw; height: 90vh; }
        .controls { height: 10vh; display: flex; justify-content: space-around; align-items: center; background: #1f1f1f; }
        button { padding: 10px 20px; background: #333; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>
    <div id="viewer"></div>
    <div class="controls">
        <button id="prev">Trước</button>
        <button id="next">Sau</button>
    </div>

    <script>
        // Thay tên file epub của ông vào chỗ 'books/truyen1.epub'
        var book = ePub("books/truyen1.epub");
        var rendition = book.renderTo("viewer", {
            width: "100%",
            height: "100%",
            flow: "paginated",
            manager: "default"
        });

        rendition.display();

        document.getElementById("next").addEventListener("click", function(){
            rendition.next();
        }, false);

        document.getElementById("prev").addEventListener("click", function(){
            rendition.prev();
        }, false);
    </script>
</body>
</html>
